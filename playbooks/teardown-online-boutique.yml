---
- name: Remove Online Boutique from the Kubernetes cluster
  hosts: k8s-master
  become: true
  gather_facts: true

  vars_files:
    - ../vars/microservices.yml

  roles:
    - role: geerlingguy.helm

  tasks:
    - name: Ensure pip is installed.
      ansible.builtin.apt:
        name: python3-pip
        state: present

    - name: Install Python libraries required by Kubernetes modules.
      ansible.builtin.pip:
        executable: pip3
        name:
          - kubernetes==29.0.0
          - PyYAML>=6.0
          - jsonpatch>=1.32
        state: present

    - name: Uninstall the Online Boutique Helm releases.
      kubernetes.core.helm:
        name: "{{ item.name }}"
        release_namespace: "{{ microservice_namespace }}"
        kubeconfig: /etc/kubernetes/admin.conf
        state: absent
        wait: true
        timeout: 10m0s
      loop: "{{ microservice_releases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Remove the application namespace.
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ microservice_namespace }}"
        wait: true
        wait_timeout: 300
