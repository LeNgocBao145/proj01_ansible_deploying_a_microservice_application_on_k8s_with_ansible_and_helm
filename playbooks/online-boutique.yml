---
- name: Deploy Online Boutique with the upstream Helm charts
  hosts: k8s-master
  become: true
  gather_facts: true

  vars_files:
    - ../vars/helm.yml
    - ../vars/microservices.yml
    - ../vars/resource-profiles.yml

  roles:
    - role: geerlingguy.helm

  tasks:
    - name: Check whether the required Helm Diff version is installed.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/helm
          - diff
          - version
      register: helm_diff_check
      changed_when: false
      failed_when: false

    - name: Remove an incompatible or broken Helm Diff plugin.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/helm
          - plugin
          - uninstall
          - diff
      when: >-
        helm_diff_check.rc != 0 or
        helm_diff_version not in helm_diff_check.stdout
      changed_when: false
      failed_when: false

    - name: Install the required Helm Diff version.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/helm
          - plugin
          - install
          - "{{ helm_diff_repository }}"
          - --version
          - "{{ helm_diff_version }}"
      when: >-
        helm_diff_check.rc != 0 or
        helm_diff_version not in helm_diff_check.stdout

    - name: Verify Helm Diff is available to the deployment user.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/helm
          - diff
          - version
      register: helm_diff_verified
      changed_when: false
      failed_when: >-
        helm_diff_verified.rc != 0 or
        helm_diff_version not in helm_diff_verified.stdout

    - name: Ensure pip is installed.
      ansible.builtin.apt:
        name: python3-pip
        state: present

    - name: Install Python libraries required by Kubernetes modules.
      ansible.builtin.pip:
        executable: pip3
        name:
          - kubernetes==29.0.0
          - PyYAML>=6.0
          - jsonpatch>=1.32
        state: present

    - name: Clone the upstream charts without modifying them.
      ansible.builtin.git:
        repo: "{{ microservice_source }}"
        dest: "{{ microservice_source_path }}"
        version: "{{ microservice_source_version }}"
        update: true

    - name: Create the application namespace.
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ microservice_namespace }}"

    - name: Create the vendored chart parent directory.
      ansible.builtin.file:
        path: "{{ microservice_vendored_chart_path | dirname }}"
        state: directory
        mode: '0755'

    - name: Copy the extended vendored microservice chart to the control plane.
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../charts/microservice/"
        dest: "{{ microservice_vendored_chart_path }}/"
        mode: preserve

    - name: Install all eleven application components with Helm.
      kubernetes.core.helm:
        name: "{{ item.name }}"
        chart_ref: "{{ microservice_source_path ~ '/' ~ item.chart if item.chart is defined else microservice_vendored_chart_path }}"
        release_namespace: "{{ microservice_namespace }}"
        kubeconfig: /etc/kubernetes/admin.conf
        values_files:
          - "{{ microservice_source_path }}/{{ item.values_file }}"
        values: >-
          {{ microservice_common_values
             | combine(item.overrides | default({}), recursive=true)
             | combine({'resources': microservice_resource_profiles.get(item.workload_name, {})}, recursive=true)
             if item.name != 'redis-cart'
             else microservice_common_values | combine(item.overrides | default({}), recursive=true) }}
        state: present
        wait: true
        timeout: 10m0s
      loop: "{{ microservice_releases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Read the frontend Service.
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Service
        name: frontend
        namespace: "{{ microservice_namespace }}"
      register: frontend_service
      until: >-
        frontend_service.resources | length > 0 and
        frontend_service.resources[0].spec.type in ['ClusterIP', 'NodePort'] and
        frontend_service.resources[0].spec.clusterIP is defined
      retries: 30
      delay: 10
      changed_when: false

    - name: Print the next command for the Ingress endpoint.
      ansible.builtin.debug:
        msg: >-
          Frontend Service is ready. Run
          ansible-playbook -i inventory playbooks/ingress.yml to publish it
          through the hostname-based Ingress.
