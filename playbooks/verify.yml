---
- name: Verify and use the Online Boutique application
  hosts: k8s-master
  become: true
  gather_facts: false

  vars_files:
    - ../vars/microservices.yml
    - ../vars/ingress.yml

  vars:
    microservice_expected_deployments:
      - adservice
      - cartservice
      - checkoutservice
      - currencyservice
      - emailservice
      - frontend
      - paymentservice
      - productcatalogservice
      - recommendationservice
      - shippingservice
      - redis-cart
  tasks:
    - name: Read Kubernetes nodes.
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Node
      register: cluster_nodes
      changed_when: false

    - name: Confirm all inventory nodes are registered and Ready.
      ansible.builtin.assert:
        that:
          - item in (cluster_nodes.resources | map(attribute='metadata.name') | list)
          - >-
            hostvars[item].ansible_host in
            (
              cluster_nodes.resources
              | map(attribute='status.addresses')
              | flatten
              | selectattr('type', 'equalto', 'InternalIP')
              | map(attribute='address')
              | list
            )
          - >-
            (
              cluster_nodes.resources
              | selectattr('metadata.name', 'equalto', item)
              | map(attribute='status.conditions')
              | flatten
              | selectattr('type', 'equalto', 'Ready')
              | map(attribute='status')
              | first
              | default('False')
            ) == 'True'
        fail_msg: >-
          Node {{ item }} is missing, is not Ready, or does not advertise its
          inventory private IP {{ hostvars[item].ansible_host }} as InternalIP.
        success_msg: >-
          Node {{ item }} is registered, Ready, and uses its inventory private IP.
      loop: "{{ groups['k8s'] }}"
      loop_control:
        label: "{{ item }}"

    - name: Read application Deployments.
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ microservice_namespace }}"
      register: application_deployments
      changed_when: false

    - name: Confirm all eleven application Deployments exist.
      ansible.builtin.assert:
        that:
          - >-
            microservice_expected_deployments
            | difference(application_deployments.resources | map(attribute='metadata.name') | list)
            | length == 0
        fail_msg: >-
          Missing Deployments:
          {{ microservice_expected_deployments
             | difference(application_deployments.resources | map(attribute='metadata.name') | list)
             | join(', ') }}
        success_msg: All eleven application Deployments are present.

    - name: Read the checkoutservice Service.
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Service
        name: checkoutservice
        namespace: "{{ microservice_namespace }}"
      register: checkoutservice_service
      changed_when: false

    - name: Confirm checkoutservice is exposed under the expected service name.
      ansible.builtin.assert:
        that:
          - checkoutservice_service.resources | length == 1
        fail_msg: The checkoutservice Service is missing.

    - name: Confirm checkoutservice selects pods with the expected label.
      ansible.builtin.assert:
        that:
          - checkoutservice_service.resources[0].spec.selector.app == 'checkoutservice'
        fail_msg: >-
          The checkoutservice Service does not select app=checkoutservice. Check
          the upstream chart values and appName override in vars/microservices.yml.
        success_msg: >-
          The checkoutservice Service exists and selects the expected checkoutservice pods.

    - name: Confirm each application Deployment has all replicas available.
      ansible.builtin.assert:
        that:
          - item.status.availableReplicas | default(0) | int >= item.spec.replicas | int
        fail_msg: >-
          Deployment {{ item.metadata.name }} has
          {{ item.status.availableReplicas | default(0) }} available replica(s),
          expected {{ item.spec.replicas }}.
        success_msg: >-
          Deployment {{ item.metadata.name }} has all requested replicas available.
      loop: "{{ application_deployments.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Read the frontend Service.
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Service
        name: frontend
        namespace: "{{ microservice_namespace }}"
      register: frontend_service
      changed_when: false

    - name: Confirm the frontend Service exists.
      ansible.builtin.assert:
        that:
          - frontend_service.resources | length == 1
        fail_msg: The frontend Service is missing.

    - name: Confirm the frontend Service has a ClusterIP and exposes port 80.
      ansible.builtin.assert:
        that:
          - frontend_service.resources[0].spec.type in ['ClusterIP', 'NodePort']
          - frontend_service.resources[0].spec.clusterIP is defined
          - frontend_service.resources[0].spec.ports | length > 0
          - frontend_service.resources[0].spec.ports[0].port | int == 80
        fail_msg: The frontend Service must be ClusterIP or NodePort and expose port 80.
        success_msg: The frontend Service has an internal ClusterIP and exposes port 80.

    - name: Read the Online Boutique Ingress.
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: networking.k8s.io/v1
        kind: Ingress
        name: online-boutique
        namespace: "{{ microservice_namespace }}"
      register: application_ingress
      changed_when: false

    - name: Confirm the application Ingress hostname and backend.
      ansible.builtin.assert:
        that:
          - application_ingress.resources | length == 1
        fail_msg: The Online Boutique Ingress is missing.

    - name: Confirm the Ingress hostname and backend are correct.
      ansible.builtin.assert:
        that:
          - application_ingress.resources[0].spec.ingressClassName == 'traefik'
          - application_ingress.resources[0].spec.rules[0].host == ingress_host
          - application_ingress.resources[0].spec.rules[0].http.paths[0].backend.service.name == 'frontend'
          - application_ingress.resources[0].spec.rules[0].http.paths[0].backend.service.port.number | int == 80
        fail_msg: The Ingress does not route the configured hostname to frontend:80.
        success_msg: The Ingress routes the configured hostname to frontend:80.

    - name: Read the Traefik NodePort Service.
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        api_version: v1
        kind: Service
        name: "{{ ingress_release_name }}"
        namespace: "{{ ingress_controller_namespace }}"
      register: traefik_service
      changed_when: false

    - name: Confirm the Traefik Service exists.
      ansible.builtin.assert:
        that:
          - traefik_service.resources | length == 1
        fail_msg: The Traefik Service is missing.

    - name: Confirm Traefik exposes the web NodePort.
      ansible.builtin.assert:
        that:
          - traefik_service.resources[0].spec.type == 'NodePort'
          - >-
            traefik_service.resources[0].spec.ports
            | selectattr('name', 'equalto', 'web') | list | length == 1

    - name: Confirm Traefik uses the configured web NodePort.
      ansible.builtin.assert:
        that:
          - >-
            (traefik_service.resources[0].spec.ports
             | selectattr('name', 'equalto', 'web') | first).nodePort | int
            == ingress_http_node_port | int
        fail_msg: Traefik does not expose the web entry point on the configured NodePort.
        success_msg: Traefik web entry point is published on NodePort {{ ingress_http_node_port }}.

    - name: Request the storefront through hostname-based Ingress routing.
      ansible.builtin.uri:
        url: "http://{{ hostvars[groups['k8s-nodes'][0]].ansible_host }}:{{ ingress_http_node_port }}/"
        method: GET
        return_content: true
        headers:
          Host: "{{ ingress_host }}"
        status_code: 200
        timeout: 30
      register: storefront_response
      changed_when: false

    - name: Confirm the response is the Online Boutique storefront.
      ansible.builtin.assert:
        that:
          - "'online boutique' in (storefront_response.content | lower)"
        fail_msg: The frontend returned HTTP 200 but its response did not identify Online Boutique.
        success_msg: The Online Boutique storefront returned HTTP 200.

    - name: Print the verified hostname URL.
      ansible.builtin.debug:
        msg: >-
          Online Boutique Ingress is available at
          http://{{ ingress_host }}:{{ ingress_http_node_port }}/
