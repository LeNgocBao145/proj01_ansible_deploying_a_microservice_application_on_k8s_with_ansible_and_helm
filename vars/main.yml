---
docker_install_compose_plugin: false

kubernetes_version: '1.29'
kubernetes_config_kubeadm_apiversion: v1beta3
kubernetes_allow_pods_on_control_plane: false
kubernetes_ignore_preflight_errors: 'all'
kubernetes_apiserver_advertise_address: "192.168.56.2"
kubernetes_flannel_manifest_file: /root/kube-flannel-vagrant.yml
kubernetes_kubelet_extra_args: '--node-ip={{ ansible_host }}'
