---
- hosts: k8s
  become: yes
  gather_facts: false
  any_errors_fatal: true

  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: Wait for SSH after Vagrant configures the private network.
      wait_for_connection:
        timeout: 300
        connect_timeout: 5
        sleep: 5

    - name: Gather facts once SSH is ready.
      setup:

    - name: Enable IPv4 forwarding for Kubernetes pod traffic.
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: true

    - name: Copy Flannel manifest tailored for Vagrant.
      copy:
        src: files/manifests/kube-system/kube-flannel-vagrant.yml
        dest: /root/kube-flannel-vagrant.yml
        mode: '0644'

    - name: Disable swap.
      command: swapoff -a
      when: ansible_facts.swaptotal_mb > 0

    - name: Remove swap from /etc/fstab.
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\bswap\b.*)$'
        replace: '# \1'

  roles:
    - role: geerlingguy.docker
      tags: ['docker']

  post_tasks:
    - name: Enable CRI plugin in containerd (disabled by Docker install).
      command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Configure containerd for Kubernetes.
      copy:
        content: >-
          {{ containerd_default_config.stdout
             | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true')
             | replace('disabled_plugins = []', 'disabled_plugins = ["io.containerd.nri.v1.nri"]') }}
        dest: /etc/containerd/config.toml
        mode: '0644'
      notify: restart containerd

    - name: Ensure containerd is restarted before Kubernetes init.
      meta: flush_handlers

  handlers:
    - name: restart containerd
      service:
        name: containerd
        state: restarted

- hosts: k8s
  become: yes
  any_errors_fatal: true

  vars_files:
    - vars/main.yml

  roles:
    - role: geerlingguy.kubernetes
      tags: ['kubernetes']

  post_tasks:
    - name: Wait for all expected nodes to register.
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o name
      register: registered_nodes
      until: registered_nodes.stdout_lines | length == groups['k8s'] | length
      retries: 30
      delay: 10
      changed_when: false
      when: kubernetes_role == 'control_plane'

    - name: Wait for Flannel on every node to be available.
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-flannel rollout status daemonset/kube-flannel-ds --timeout=300s
      changed_when: false
      when:
        - kubernetes_role == 'control_plane'
        - kubernetes_pod_network.cni == 'flannel'

    - name: Wait for all Kubernetes nodes to be Ready.
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false
      when: kubernetes_role == 'control_plane'

    - name: Wait for cluster DNS to be available.
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system rollout status deployment/coredns --timeout=300s
      changed_when: false
      when: kubernetes_role == 'control_plane'
